<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="builderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <linearGradient id="handoffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" rx="12" fill="#0d1117"/>

  <!-- === HERO CARD === -->
  <rect x="40" y="24" width="880" height="72" rx="10" fill="#161b22" stroke="#f97316" stroke-width="1.5"/>
  <rect x="40" y="24" width="880" height="3" rx="2" fill="url(#builderGrad)"/>
  <text x="60" y="52" fill="#e6edf3" font-size="14" font-weight="600">ai-startup-builder</text>
  <text x="60" y="70" fill="#8b949e" font-size="11">From raw idea to validated, designed, and fully specced project package — ~1 hour</text>
  <text x="60" y="86" fill="#f97316" font-size="9" font-weight="500" letter-spacing="1">BUSINESS CO-FOUNDER</text>
  <text x="900" y="70" text-anchor="end" fill="#6e7681" font-size="9">Claude Code · Cursor · Codex · Gemini CLI</text>

  <!-- === SKILL CHAIN === -->
  <line x1="80" y1="116" x2="880" y2="116" stroke="#21262d" stroke-width="1"/>

  <!-- /refine (dashed — optional entry point) -->
  <rect x="40" y="132" width="96" height="44" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="88" y="152" text-anchor="middle" fill="#6e7681" font-size="11" font-weight="600">/refine</text>
  <text x="88" y="168" text-anchor="middle" fill="#6e7681" font-size="9">sharpen idea</text>

  <!-- Arrow -->
  <line x1="140" y1="154" x2="152" y2="154" stroke="#30363d" stroke-width="1.5"/>
  <polygon points="152,150 160,154 152,158" fill="#30363d"/>

  <!-- /score -->
  <rect x="163" y="132" width="110" height="44" rx="8" fill="#161b22" stroke="#f97316" stroke-width="1.2"/>
  <text x="218" y="152" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">/score</text>
  <text x="218" y="168" text-anchor="middle" fill="#8b949e" font-size="9">validate /100</text>

  <!-- Gate 1 -->
  <line x1="277" y1="154" x2="287" y2="154" stroke="#30363d" stroke-width="1"/>
  <polygon points="297,154 310,143 323,154 310,165" fill="#21262d" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="310" y="158" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">G1</text>
  <line x1="327" y1="154" x2="337" y2="154" stroke="#30363d" stroke-width="1"/>

  <!-- /plan -->
  <rect x="340" y="132" width="100" height="44" rx="8" fill="#161b22" stroke="#f97316" stroke-width="1.2"/>
  <text x="390" y="152" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">/plan</text>
  <text x="390" y="168" text-anchor="middle" fill="#8b949e" font-size="9">MVP roadmap</text>

  <!-- Gate 2 -->
  <line x1="444" y1="154" x2="454" y2="154" stroke="#30363d" stroke-width="1"/>
  <polygon points="464,154 477,143 490,154 477,165" fill="#21262d" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="477" y="158" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">G2</text>
  <line x1="494" y1="154" x2="504" y2="154" stroke="#30363d" stroke-width="1"/>

  <!-- /mockup -->
  <rect x="507" y="132" width="110" height="44" rx="8" fill="#161b22" stroke="#f97316" stroke-width="1.2"/>
  <text x="562" y="152" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">/mockup</text>
  <text x="562" y="168" text-anchor="middle" fill="#8b949e" font-size="9">design + screens</text>

  <!-- Gate 3 -->
  <line x1="621" y1="154" x2="631" y2="154" stroke="#30363d" stroke-width="1"/>
  <polygon points="641,154 654,143 667,154 654,165" fill="#21262d" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="654" y="158" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="700">G3</text>
  <line x1="671" y1="154" x2="681" y2="154" stroke="#30363d" stroke-width="1"/>

  <!-- /package -->
  <rect x="684" y="132" width="104" height="44" rx="8" fill="#161b22" stroke="#f97316" stroke-width="1.2"/>
  <text x="736" y="152" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">/package</text>
  <text x="736" y="168" text-anchor="middle" fill="#8b949e" font-size="9">dev handoff</text>

  <!-- Handoff arrow + /investor-check -->
  <line x1="792" y1="154" x2="808" y2="154" stroke="#30363d" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="812" y="132" width="108" height="44" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="866" y="152" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">/investor-check</text>
  <text x="866" y="168" text-anchor="middle" fill="#6e7681" font-size="9">standalone</text>

  <!-- === OUTPUTS === -->
  <line x1="80" y1="196" x2="880" y2="196" stroke="#21262d" stroke-width="1"/>
  <text x="40" y="216" fill="#6e7681" font-size="9" font-weight="600" letter-spacing="1">OUTPUTS</text>

  <!-- /score output -->
  <rect x="163" y="206" width="110" height="22" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="218" y="221" text-anchor="middle" fill="#8b949e" font-size="9">idea-scorecard.md</text>

  <!-- /plan output -->
  <rect x="340" y="206" width="100" height="22" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="390" y="221" text-anchor="middle" fill="#8b949e" font-size="9">project-plan.md</text>

  <!-- /mockup output -->
  <rect x="488" y="206" width="148" height="22" rx="4" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="562" y="221" text-anchor="middle" fill="#8b949e" font-size="9">design-system · flows · mockups/</text>

  <!-- /package outputs -->
  <rect x="660" y="205" width="128" height="34" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="724" y="218" text-anchor="middle" fill="#8b949e" font-size="9">tech-spec.md</text>
  <text x="724" y="231" text-anchor="middle" fill="#8b949e" font-size="9">AI-TECH-LEAD.md</text>

  <!-- === MODES (inside /score) === -->
  <line x1="80" y1="252" x2="880" y2="252" stroke="#21262d" stroke-width="1"/>

  <!-- Section label -->
  <text x="40" y="272" fill="#6e7681" font-size="9" font-weight="600" letter-spacing="1">MODES INSIDE /score</text>

  <!-- ROAST MODE -->
  <rect x="40" y="280" width="400" height="36" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="60" y="296" fill="#e6edf3" font-size="10" font-weight="600">ROAST MODE</text>
  <text x="60" y="309" fill="#8b949e" font-size="9">say "roast me" inside /score — brutal no-filter feedback + top 3 fixes</text>

  <!-- PIVOT MODE -->
  <rect x="456" y="280" width="464" height="36" rx="8" fill="#161b22" stroke="#484f58" stroke-width="1"/>
  <text x="476" y="296" fill="#e6edf3" font-size="10" font-weight="600">PIVOT MODE</text>
  <text x="476" y="309" fill="#8b949e" font-size="9">say "pivot" or score &lt; 61 auto-triggers — 3 alternative directions, each scored</text>

  <!-- === GATES === -->
  <line x1="80" y1="332" x2="880" y2="332" stroke="#21262d" stroke-width="1"/>

  <text x="480" y="354" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Gates</text>

  <rect x="40" y="366" width="268" height="38" rx="6" fill="#161b22" stroke="#f59e0b44" stroke-width="1"/>
  <rect x="46" y="372" width="3" height="26" rx="1.5" fill="#f59e0b"/>
  <text x="58" y="383" fill="#f59e0b" font-size="10" font-weight="700">GATE APPROVAL REQUIRED</text>
  <text x="58" y="397" fill="#8b949e" font-size="9">No gate = no next skill. Non-negotiable.</text>

  <rect x="328" y="366" width="268" height="38" rx="6" fill="#161b22" stroke="#ef444444" stroke-width="1"/>
  <rect x="334" y="372" width="3" height="26" rx="1.5" fill="#ef4444"/>
  <text x="346" y="383" fill="#ef4444" font-size="10" font-weight="700">PIVOT OR KILL</text>
  <text x="346" y="397" fill="#8b949e" font-size="9">Score &lt; 61 triggers pivots or KILL verdict.</text>

  <rect x="616" y="366" width="304" height="38" rx="6" fill="#161b22" stroke="#10b98144" stroke-width="1"/>
  <rect x="622" y="372" width="3" height="26" rx="1.5" fill="#10b981"/>
  <text x="634" y="383" fill="#10b981" font-size="10" font-weight="700">HANDOFF TO ai-tech-lead</text>
  <text x="634" y="397" fill="#8b949e" font-size="9">/package outputs drop straight into the build.</text>

  <!-- === QUICK START === -->
  <line x1="80" y1="422" x2="880" y2="422" stroke="#21262d" stroke-width="1"/>

  <rect x="40" y="434" width="880" height="18" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="447" text-anchor="middle" fill="#7ee787" font-size="11" font-family="'SF Mono', 'Fira Code', monospace">/refine  /score  /plan  /mockup  /package  /investor-check</text>

</svg>
